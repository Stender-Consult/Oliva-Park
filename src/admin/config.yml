backend:
  name: git-gateway
  branch: main

media_folder: "src/images"
public_folder: "/images"

site_url: https://oliva-park.no

collections:
  - name: "prosjekter"
    label: "Referanser (prosjekter)"
    label_singular: "Prosjekt"
    folder: "src/prosjekter"
    create: true
    slug: "{{slug}}"
    identifier_field: tittel
    fields:
      - { label: "Tittel", name: "tittel", widget: "string", hint: "Nettadressen lages automatisk ut fra tittelen." }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        multiple: true
        min: 1
        options: ["Utenomhusarbeider", "Grunn- og VA-arbeider", "Skjøtsel og vedlikehold", "Rivearbeider"]
      - { label: "Sted", name: "sted", widget: "select", options: ["Østfold", "Akershus", "Oslo"] }
      - { label: "Dato", name: "dato", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Hovedbilde", name: "bilde", widget: "image" }
      - { label: "Beskrivelse", name: "beskrivelse", widget: "text" }
      - label: "Flere bilder"
        name: "bilder"
        widget: "image"
        multiple: true
        required: false
        hint: "Du kan velge flere bilder på én gang i opplastingsvinduet."
      - { label: "Layout (ikke endre)", name: "layout", widget: "hidden", default: "prosjekt.njk" }
